# V-OS AI Tools Recipe
# AI-assisted development and testing utilities

[source]
git = "https://github.com/v-os-os/ai-tools.git"
branch = "main"

[build]
template = "cargo"

[package]
name = "v-os-ai-tools"
version = "0.1.0"
description = "AI-assisted code scaffolding, fuzzing, and static analysis tools"
authors = ["V-OS Team"]
license = "MIT"

dependencies = [
    "relibc",
]

[build.cargo]
features = ["code-scaffold", "fuzz-harness", "unsafe-audit", "static-analysis"]

[package.files]
"/usr/bin/v-os-scaffold" = "target/release/v-os-scaffold"
"/usr/bin/v-os-fuzz" = "target/release/v-os-fuzz"
"/usr/bin/v-os-audit" = "target/release/v-os-audit"
"/usr/bin/v-os-analyze" = "target/release/v-os-analyze"
