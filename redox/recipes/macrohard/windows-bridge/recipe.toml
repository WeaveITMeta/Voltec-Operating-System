# V-OS Windows Bridge Recipe
# Seamless Windows guest integration

[source]
git = "https://github.com/v-os-os/windows-bridge.git"
branch = "main"

[build]
template = "cargo"

[package]
name = "v-os-windows-bridge"
version = "0.1.0"
description = "Windows guest integration with clipboard sync, shared folders, and seamless windows"
authors = ["V-OS Team"]
license = "MIT"

dependencies = [
    "v-os-hypervisor",
    "orbital",
    "relibc",
]

[build.cargo]
features = ["clipboard-sync", "shared-folders", "seamless-mode"]

[package.files]
"/usr/bin/v-os-windows-bridge" = "target/release/v-os-windows-bridge"
"/usr/lib/libwindows_bridge.so" = "target/release/libwindows_bridge.so"
