# V-OS Core Package
# Essential V-OS-specific utilities and branding

[source]
# Will be replaced with actual repo when created
git = "https://github.com/v-os-os/core.git"
branch = "main"

[build]
template = "cargo"

[package]
name = "v-os-core"
version = "0.1.0"
description = "V-OS core utilities and branding"
authors = ["V-OS Team"]
license = "MIT"

dependencies = [
    "relibc",
]

[package.files]
"/usr/bin/v-os-info" = "target/release/v-os-info"
"/usr/share/v-os/VERSION" = "VERSION"
"/usr/share/v-os/branding/logo.txt" = "assets/logo.txt"
