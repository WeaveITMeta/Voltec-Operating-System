# =============================================================================
# libqft - C FFI Bindings for Quantum File Type (.qft)
# =============================================================================
# Table of Contents:
#   1. Package Configuration - Crate metadata and build settings
#   2. Library Configuration - cdylib for C ABI compatibility
#   3. Dependencies - Core quantum runtime and FFI utilities
#   4. Features - Optional functionality toggles
# =============================================================================

[package]
name = "libqft"
version = "1.0.0"
edition = "2024"
authors = ["MACROHARD Quantum OS Team"]
license = "MIT OR Apache-2.0"
description = "Production-grade C FFI bindings for Quantum File Type (.qft) format"
repository = "https://github.com/WeaveITMeta/Quantum-Operating-System"
documentation = "https://docs.rs/libqft"
keywords = ["quantum", "ffi", "qft", "mps", "tensor-network"]
categories = ["science", "api-bindings", "encoding"]
readme = "README.md"
rust-version = "1.83"

# =============================================================================
# Library Configuration - Produces both static and dynamic C libraries
# =============================================================================
[lib]
name = "qft"
crate-type = ["cdylib", "staticlib", "rlib"]

# =============================================================================
# Dependencies
# =============================================================================
[dependencies]
# Core quantum runtime
quantum_runtime = { path = "../quantum_runtime", features = ["qft_format", "qft_golay"] }

# FFI utilities
libc = "0.2"

# Error handling
thiserror = "2"

# Logging (optional, for debug builds)
tracing = { version = "0.1", optional = true }

# Thread safety
parking_lot = "0.12"

# Serialization for metadata
serde_json = "1.0"

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
tempfile = "3"

# =============================================================================
# Features
# =============================================================================
[features]
default = ["thread_safe"]
thread_safe = []
logging = ["tracing"]
full = ["thread_safe", "logging"]

# =============================================================================
# C Header Generation
# =============================================================================
[package.metadata.cbindgen]
language = "C"
header = "/* libqft - Quantum File Type C API */\n/* Auto-generated by cbindgen - DO NOT EDIT */\n"
include_guard = "LIBQFT_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Don't modify this manually. */"
