# =============================================================================
# Sync Upstream Redox OS Changes
# =============================================================================
# Automatically fetches and merges changes from official Redox OS repository
# Runs weekly or can be triggered manually
# =============================================================================

name: Sync Upstream Redox OS

on:
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      merge_strategy:
        description: 'Merge strategy (merge or rebase)'
        required: false
        default: 'merge'
        type: choice
        options:
          - merge
          - rebase

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://gitlab.redox-os.org/redox-os/redox.git || true
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_COMMITS=$(git rev-list HEAD..upstream/master --count 2>/dev/null || echo "0")
          echo "upstream_commits=$UPSTREAM_COMMITS" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM_COMMITS" -gt "0" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Found $UPSTREAM_COMMITS new commits from upstream"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new upstream changes"
          fi

      - name: Create sync branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BRANCH_NAME="sync/upstream-$(date +%Y%m%d)"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Merge upstream changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git merge upstream/master --allow-unrelated-histories -m "chore: sync upstream Redox OS changes" || {
            echo "Merge conflicts detected. Creating PR for manual resolution."
            git merge --abort
            git checkout -b ${{ env.branch_name }}-conflicts
            git merge upstream/master --allow-unrelated-histories --no-commit || true
            git add -A
            git commit -m "chore: sync upstream (conflicts need resolution)"
          }

      - name: Push changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git push origin ${{ env.branch_name }}

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.branch_name }}
          title: "chore: Sync upstream Redox OS changes"
          body: |
            ## Upstream Sync
            
            This PR syncs changes from the official Redox OS repository.
            
            **Upstream:** https://gitlab.redox-os.org/redox-os/redox
            **Commits:** ${{ steps.check.outputs.upstream_commits }} new commits
            
            ### Review Checklist
            - [ ] Check for breaking changes
            - [ ] Verify quantum extensions still work
            - [ ] Run tests
            
            ---
            *Auto-generated by sync-upstream workflow*
          labels: |
            upstream-sync
            automated
          draft: false
