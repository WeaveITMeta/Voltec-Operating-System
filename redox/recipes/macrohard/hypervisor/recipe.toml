# V-OS Hypervisor Recipe
# Built-in hypervisor for running Windows/Linux guests

[source]
git = "https://github.com/v-os-os/hypervisor.git"
branch = "main"

[build]
template = "cargo"

[package]
# Package metadata
name = "v-os-hypervisor"
version = "0.1.0"
description = "V-OS OS built-in hypervisor with VT-x/AMD-V support"
authors = ["V-OS Team"]
license = "MIT"

# Dependencies on other recipes
dependencies = [
    "kernel",
    "relibc",
]

# Runtime dependencies
runtime_dependencies = []

# Build features
[build.cargo]
features = ["intel-vtx", "amd-svm", "virtio"]

# Installation paths
[package.files]
"/usr/bin/v-os-hypervisor" = "target/release/v-os-hypervisor"
"/usr/lib/libv-os_hypervisor.so" = "target/release/libv-os_hypervisor.so"
