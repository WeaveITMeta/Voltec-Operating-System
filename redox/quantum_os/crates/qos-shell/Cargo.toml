# =============================================================================
# Quantum OS Shell - Slint-based Desktop Environment
# =============================================================================
# Table of Contents:
#   1. Package Configuration
#   2. Dependencies - Slint UI + QDB integration
#   3. Build Configuration
# =============================================================================

[package]
name = "qos-shell"
version = "0.1.0"
edition = "2021"
authors = ["MACROHARD Quantum OS Team"]
description = "Quantum OS Desktop Shell - Slint-based UI with QDB filesystem"
license = "MIT"
repository = "https://github.com/WeaveITMeta/Quantum-Operating-System"

[dependencies]
# Slint UI Framework
slint = "1.9"

# QDB for filesystem backend
qdb-rs = { path = "../qdb-rs" }
qft = { package = "qft-rs", path = "../qft-rs" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# IPC for Eustress communication
interprocess = "2.2"

# Utilities
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

[build-dependencies]
slint-build = "1.9"

[[bin]]
name = "qos-shell"
path = "src/main.rs"

[features]
default = []
eustress = []  # Enable Eustress 3D integration
