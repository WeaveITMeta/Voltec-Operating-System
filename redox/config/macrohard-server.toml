# V-OS Server Configuration
# Headless server variant optimized for cloud/edge deployment

include = ["server.toml"]

# General settings
[general]
# Filesystem size in MiB
filesystem_size = 1024

# Package settings
[packages]
# Server packages inherited from server.toml

# Hypervisor support for VM hosting
# v-os-hypervisor = {}

# Security hardening
# v-os-security = {}

[[files]]
path = "/etc/hostname"
data = "v-os-server"

[[files]]
path = "/usr/lib/os-release"
data = """
PRETTY_NAME="V-OS Server 0.1.0-alpha"
NAME="V-OS Server"
VERSION_ID="0.1.0"
VERSION="0.1.0-alpha (Forked from Redox OS 0.9.0)"
ID="v-os-os"
ID_LIKE="redox-os"
VARIANT="Server"
VARIANT_ID="server"

HOME_URL="https://v-os-os.org/"
DOCUMENTATION_URL="https://v-os-os.org/docs/"
SUPPORT_URL="https://v-os-os.org/community/"
"""

[[files]]
path = "/usr/lib/init.d/50_v-os"
data = """
# V-OS Server initialization
# Hypervisor service for VM hosting
# nowait v-os-hypervisor --server-mode

# Security daemon
# nowait v-os-security-daemon
"""
