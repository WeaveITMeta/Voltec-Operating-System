# V-OS Desktop Configuration
# Full-featured desktop environment with hypervisor support

include = ["desktop.toml"]

# General settings
[general]
# Filesystem size in MiB - larger for hypervisor and Windows guest support
filesystem_size = 2048

# Package settings - V-OS additions
[packages]
# Core desktop packages inherited from desktop.toml

# Hypervisor support (Phase 4)
# v-os-hypervisor = {}

# AI-assisted development tools (Phase 8)
# v-os-ai-tools = {}

# Security enhancements (Phase 7)
# v-os-security = {}

# Windows integration (Phase 5)
# v-os-windows-bridge = {}

[[files]]
path = "/etc/hostname"
data = "v-os"

[[files]]
path = "/usr/lib/os-release"
data = """
PRETTY_NAME="V-OS 0.1.0-alpha"
NAME="V-OS"
VERSION_ID="0.1.0"
VERSION="0.1.0-alpha (Forked from Redox OS 0.9.0)"
ID="v-os-os"
ID_LIKE="redox-os"

HOME_URL="https://v-os-os.org/"
DOCUMENTATION_URL="https://v-os-os.org/docs/"
SUPPORT_URL="https://v-os-os.org/community/"
BUG_REPORT_URL="https://github.com/v-os-os/v-os/issues"
"""

[[files]]
path = "/usr/lib/init.d/20_orbital"
data = """
audiod
export BROWSER /bin/netsurf-fb
export VT 3
nowait orbital orblogin launcher
unset BROWSER
unset VT
"""

# V-OS-specific init scripts
[[files]]
path = "/usr/lib/init.d/50_v-os"
data = """
# V-OS initialization
# Hypervisor service (when available)
# nowait v-os-hypervisor

# Security daemon (when available)
# nowait v-os-security-daemon
"""
