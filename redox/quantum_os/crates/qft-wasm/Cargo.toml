# =============================================================================
# qft-wasm - WebAssembly Bindings for Quantum File Type (.qft)
# =============================================================================
# Table of Contents:
#   1. Package Configuration - Crate metadata and WASM settings
#   2. Library Configuration - cdylib for WASM module
#   3. Dependencies - wasm-bindgen, js-sys, web-sys
#   4. Features - Optional functionality toggles
# =============================================================================

[package]
name = "qft-wasm"
version = "1.0.0"
edition = "2024"
authors = ["MACROHARD Quantum OS Team"]
license = "MIT OR Apache-2.0"
description = "Production-grade WebAssembly bindings for Quantum File Type (.qft) format"
repository = "https://github.com/WeaveITMeta/Quantum-Operating-System"
documentation = "https://docs.rs/qft-wasm"
keywords = ["quantum", "wasm", "webassembly", "qft", "mps"]
categories = ["science", "wasm", "encoding"]
readme = "README.md"
rust-version = "1.83"

# =============================================================================
# Library Configuration - WebAssembly module
# =============================================================================
[lib]
crate-type = ["cdylib", "rlib"]

# =============================================================================
# Dependencies
# =============================================================================
[dependencies]
# WebAssembly bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Performance",
    "Window",
    "Blob",
    "File",
    "FileReader",
    "Url",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Error handling
thiserror = "2"

# Utilities
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# =============================================================================
# Features
# =============================================================================
[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

# =============================================================================
# Profile Configuration
# =============================================================================
[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-mutable-globals"]
