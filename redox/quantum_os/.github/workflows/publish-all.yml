# =============================================================================
# QFT SDK Multi-Language Publishing Workflow
# =============================================================================
# Publishes all QFT SDKs to their respective package registries:
# - qft-rs → crates.io
# - qft-python → PyPI
# - qft-ts → npm
# - qft-wasm → npm
# - qft-go → Go Proxy (automatic via tags)
# - qft-java → Maven Central
# - qft-scala → Maven Central
# - libqft → Conan Center (manual PR)
# =============================================================================

name: Publish QFT SDKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string
      packages:
        description: 'Packages to publish (comma-separated or "all")'
        required: false
        default: 'all'
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Rust SDK → crates.io
  # ===========================================================================
  publish-rust:
    name: Publish qft-rs to crates.io
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || contains(github.event.inputs.packages, 'rust') || github.event.inputs.packages == 'all'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
      
      - name: Publish to crates.io
        working-directory: redox/quantum_os/crates/qft-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          cargo publish --allow-dirty

  # ===========================================================================
  # Python SDK → PyPI
  # ===========================================================================
  publish-python:
    name: Publish qft-python to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || contains(github.event.inputs.packages, 'python') || github.event.inputs.packages == 'all'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install maturin
        run: pip install maturin
      
      - name: Build wheels
        working-directory: redox/quantum_os/crates/qft-python
        run: maturin build --release
      
      - name: Publish to PyPI
        working-directory: redox/quantum_os/crates/qft-python
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: maturin publish

  # ===========================================================================
  # TypeScript SDK → npm
  # ===========================================================================
  publish-typescript:
    name: Publish @qft/core to npm
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || contains(github.event.inputs.packages, 'typescript') || github.event.inputs.packages == 'all'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        working-directory: redox/quantum_os/crates/qft-ts
        run: bun install
      
      - name: Build
        working-directory: redox/quantum_os/crates/qft-ts
        run: bun run build
      
      - name: Publish to npm
        working-directory: redox/quantum_os/crates/qft-ts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          bun publish --access public

  # ===========================================================================
  # WebAssembly SDK → npm
  # ===========================================================================
  publish-wasm:
    name: Publish qft-wasm to npm
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || contains(github.event.inputs.packages, 'wasm') || github.event.inputs.packages == 'all'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Install wasm-pack
        run: cargo install wasm-pack
      
      - name: Build WASM package
        working-directory: redox/quantum_os/crates/qft-wasm
        run: wasm-pack build --target web --release
      
      - name: Publish to npm
        working-directory: redox/quantum_os/crates/qft-wasm/pkg
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm publish --access public

  # ===========================================================================
  # Java SDK → Maven Central
  # ===========================================================================
  publish-java:
    name: Publish qft-java to Maven Central
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || contains(github.event.inputs.packages, 'java') || github.event.inputs.packages == 'all'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      
      - name: Publish to Maven Central
        working-directory: redox/quantum_os/crates/qft-java
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn clean deploy -P release -DskipTests

  # ===========================================================================
  # Scala SDK → Maven Central
  # ===========================================================================
  publish-scala:
    name: Publish qft-scala to Maven Central
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || contains(github.event.inputs.packages, 'scala') || github.event.inputs.packages == 'all'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      
      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
      
      - name: Publish to Maven Central
        working-directory: redox/quantum_os/crates/qft-scala
        env:
          SONATYPE_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          PGP_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          sbt publishSigned

  # ===========================================================================
  # C/C++ SDK → Build artifacts for release
  # ===========================================================================
  build-libqft:
    name: Build libqft for multiple platforms
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release' || contains(github.event.inputs.packages, 'c') || github.event.inputs.packages == 'all'
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libqft.so
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: libqft.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libqft.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: qft.dll
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build library
        working-directory: redox/quantum_os/crates/libqft
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libqft-${{ matrix.target }}
          path: |
            redox/quantum_os/crates/libqft/target/${{ matrix.target }}/release/${{ matrix.artifact }}
            redox/quantum_os/crates/libqft/target/${{ matrix.target }}/release/*.a
            redox/quantum_os/crates/libqft/include/qft.h

  # ===========================================================================
  # Attach all artifacts to GitHub Release
  # ===========================================================================
  attach-release-artifacts:
    name: Attach artifacts to release
    runs-on: ubuntu-latest
    needs: [build-libqft]
    if: github.event_name == 'release'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create release archives
        run: |
          cd artifacts
          for dir in */; do
            tar -czvf "${dir%/}.tar.gz" "$dir"
          done
      
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
