# V-OS Security Daemon Recipe
# Enhanced security services for V-OS

[source]
git = "https://github.com/v-os-os/security.git"
branch = "main"

[build]
template = "cargo"

[package]
name = "v-os-security"
version = "0.1.0"
description = "V-OS security daemon with capability management and syscall filtering"
authors = ["V-OS Team"]
license = "MIT"

dependencies = [
    "kernel",
    "relibc",
]

[build.cargo]
features = ["syscall-filter", "capability-audit", "secure-boot"]

[package.files]
"/usr/bin/v-os-security-daemon" = "target/release/v-os-security-daemon"
"/usr/bin/v-os-audit" = "target/release/v-os-audit"
"/etc/v-os/security.toml" = "config/security.toml"
